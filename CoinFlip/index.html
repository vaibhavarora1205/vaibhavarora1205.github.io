<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Coin</title>
    <link rel="stylesheet" href="style.css">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-col items-center bg-gray-500">
    <h1 class="text-4xl font-bold my-8 fext text-shadow-lg/50 text-white">Flip the coin</h1>
    <p class="text-gray-200">Press the coin or button to flip the coin</p>
    <div class="h-30 w-30 border text-4xl text-white bg-yellow-400 rounded-full m-15 flex justify-center items-center shadow-xl/30" id="coin" onclick=flipCoin()>$</div>
    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" id="flipbutton">Flip the coin</button>
    <script src="app.js"></script>
</body>
</html>
