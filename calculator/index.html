<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="display">
            <p id="output">0</p>
        </div>
        <button class="btn" id="ac">AC</button>
        <button class="btn" id="del">DEL</button>
        <button class="btn" id="per">%</button>
        <button class="btn" id="divide">/</button>
        <button class="btn" id="7">7</button>
        <button class="btn" id="8">8</button>
        <button class="btn" id="9">9</button>
        <button class="btn" id="mul">X</button>
        <button class="btn" id="4">4</button>
        <button class="btn" id="5">5</button>
        <button class="btn" id="6">6</button>
        <button class="btn" id="sub">-</button>
        <button class="btn" id="1">1</button>
        <button class="btn" id="2">2</button>
        <button class="btn" id="3">3</button>
        <button class="btn" id="add">+</button>
        <button class="btn" id="0">0</button>
        <button class="btn" id="point">.</button>
        <button class="btn equal" id="ans">=</button>
    </div>

    <div class="coloroptions">
        <h3>Change Colour:</h3>
        <div class="colours" style="background-color: white;">1</div>
        <div class="colours" style="background-color: #ffdcd7;">2</div>
        <div class="colours" style="background-color: #add6ff;">3</div>
        <div class="colours" style="background-color: #252d33;">4</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
